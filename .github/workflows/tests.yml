# Die Suite läuft auf Linux und Windows ohne grafische Sitzung. Pillow und OpenCV
# verhindern still übersprungene Bildtests; Linux bekommt zusätzlich seine X11-
# Adapter. Die Matrix prüft beide Plattform-Backends mit demselben Testvertrag.
#
# Warum das ueberhaupt hier steht: es gab ueber 1.200 Pruefungen und nichts, was sie
# ausfuehrt. Eine Suite, die nur laeuft, wenn jemand daran denkt, faengt Regressionen
# genau dann nicht, wenn man in Eile ist.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Suite (${{ matrix.os }}, ${{ matrix.bilder }} Bildpakete)
    strategy:
      fail-fast: false
      matrix:
        # ZWEI unabhängige Achsen: zwei Systeme, drei Paketkonstellationen.
        #
        # `os`: beide Plattform-Backends gegen denselben Testvertrag. Nur eine
        # Haelfte zu bauen ist der Fehler, den diese Achse faengt.
        #
        # `bilder`: OpenCV und Pillow sind optional, und der Code degradiert
        # sauber ohne sie (`OPENCV_AVAILABLE`-Muster). Genau deshalb UEBERSPRINGT
        # die Suite ohne sie ueber hundert Pruefungen - Template-Vergleich,
        # Masken, Slot-Erkennung, die Groessen-Meldung. Ein Lauf nur MIT den
        # Paketen sagt nichts darueber, ob der Degradationspfad noch traegt; ein
        # Lauf nur OHNE sie ist gruen, waehrend der halbe Bilderkennungs-Teil
        # ungeprueft bleibt. Genau daran ist hier schon einmal eine kaputte
        # Meldung durchgerutscht. Dieselbe Regel wie bei den Plattform-Stubs:
        # was der Ersatz anders macht als das Echte, wird auf BEIDEN Seiten geprueft.
        os: [ubuntu-latest, windows-latest]
        bilder: [ohne, pillow, mit]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 ist die untere Grenze (PEP-604-Syntax `X | None` im Baum), und
          # genau die gehoert geprueft: auf der neuesten Version zu testen sagt
          # nichts darueber, ob die aelteste noch traegt.
          python-version: "3.10"

      # headless: der Runner hat keine Anzeige, und das volle opencv-python zieht
      # GUI-Bibliotheken nach, die es dort nicht gibt.
      - name: Bildpakete
        if: matrix.bilder == 'mit'
        run: python -m pip install pillow numpy opencv-python-headless

      # Teilinstallationen sind ebenfalls unterstützt: Pillow ohne OpenCV.
      - name: Nur Pillow
        if: matrix.bilder == 'pillow'
        run: python -m pip install pillow

      # Kein Bildpaket, sondern die Plattformgrenze - gehoert deshalb in BEIDE
      # Bilder-Varianten.
      - name: Linux-Plattformabhängigkeiten
        if: runner.os == 'Linux'
        run: python -m pip install mss pynput python-xlib

      # EIN Aufruf fuer alles - dieselbe Zeile, die man vor einem Commit tippt.
      # Vorher standen hier zwei Schritte mit einer `if`-Bedingung, weil zwei
      # Wurzelmodule ohne Pillow schon beim IMPORT starben. Das ist repariert
      # (sie ueberspringen jetzt sauber), und damit faellt der Sonderfall weg.
      #
      # Die Rauchtests brauchen einen Browser und ueberspringen sich hier selbst;
      # sie laufen im eigenen Job unten, wo einer installiert ist.
      - name: Alle Tests
        run: python tools/alle_tests.py --nur vertrag --nur wurzel --mutationen
        env:
          PYTHONIOENCODING: utf-8

  # Die dritte Schicht: die echte Seite in einem echten Browser vor der echten
  # Bruecke. Sie faengt, was die Vertragssuite nicht sehen KANN - die ruft die
  # Bruecken-Methoden direkt auf, also genau so, wie die Seite es nicht tut.
  # Ein Tippfehler in einem Methodennamen faellt dort nicht auf und im Fenster
  # sofort: der Reiter bleibt leer.
  #
  # Nur auf Linux und nur einmal: es geht um die Seite, nicht um die Plattform.
  rauchtests:
    name: Rauchtests (Browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pillow numpy opencv-python-headless playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/alle_tests.py --nur rauch --rauch-pflicht
        env:
          PYTHONIOENCODING: utf-8

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install flake8
      # Nur die F-Regeln (das ist genau pyflakes: tote Importe, Tippfehler in Namen,
      # doppelte Definitionen) - kein Formatierer, ueber Stil entscheidet hier
      # niemand ausser dem Autor. flake8 statt pyflakes direkt, weil nur flake8 die
      # `# noqa: F401`-Kommentare kennt, mit denen die msvcrt-Stubs markiert sind;
      # pyflakes meldet die sonst bei jedem Lauf.
      - run: python -m flake8 --select=F autoclicker/ market_analysis/ main.py tools/ test_*.py
