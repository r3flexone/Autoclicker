<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sequenz-Studio</title>
<!--
  Oberfläche des Sequenz-Studios.

  Selbstgenügsam mit Absicht: kein Framework, keine Schrift, kein Bild von außen.
  Die Seite läuft in einem pywebview-Fenster ohne Netz, und alles, was sie
  nachladen wollte, wäre beim Start eine leere Fläche.

  Zustand hält sie keinen: `S` ist die letzte Momentaufnahme aus der Brücke, jede
  Änderung geht als Befehl dorthin und kommt als neue Momentaufnahme zurück. Das
  ist der Grund, warum hier fast nur Aufbau steht — die Editor-Logik (Auswahl,
  Umsortieren, Feldregeln) liegt in bridge.py und wird dort gemessen.
-->
<style>
:root{
  --bg:#0C0F14; --panel:#141921; --sub:#1C2333; --line:#2A3245;
  --text:#E2E8F0; --muted:#94A3B8; --dim:#64748B;
  --accent:#F59E0B; --ok:#3ED07A; --err:#EF4444;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:13.5px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:var(--bg)}

/* ---------------------------------------------------------------- Grundformen */
.app{display:flex;flex-direction:column;height:100%}
.reihe{display:flex;align-items:center;gap:8px}
.spalte{display:flex;flex-direction:column;gap:8px}
.wachse{flex:1;min-width:0}
.klein{font-size:11.5px;color:var(--dim)}
.mono{font-family:var(--mono)}
.trenner{width:1px;height:24px;background:var(--line);flex:none}

button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.btn{
  padding:6px 12px;border-radius:5px;background:var(--sub);
  border:1px solid var(--line);color:var(--text);white-space:nowrap;
}
.btn:hover{border-color:var(--dim)}
.btn.haupt{background:var(--accent);border-color:var(--accent);color:#0C0F14;font-weight:600}
.btn.haupt:hover{filter:brightness(1.08)}
.btn.still{background:none;border-color:transparent;color:var(--muted);padding:4px 7px}
.btn.still:hover{background:var(--sub);color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gefahr:hover{border-color:var(--err);color:var(--err)}

input,select,textarea{
  font:inherit;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:4px;padding:5px 7px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled,textarea:disabled{background:var(--sub);color:var(--dim)}
input[type=number]{font-family:var(--mono)}
textarea{resize:vertical;min-height:52px}
label.feld{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
label.an{flex-direction:row;align-items:center;gap:7px;color:var(--text);font-size:12.5px;cursor:pointer}
label.an input{width:auto}
.gitter2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gitter3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* --------------------------------------------------------------------- Kopf */
.kopf{
  height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.marke{width:22px;height:22px;border-radius:4px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#0C0F14}
.titel{font-size:12px;letter-spacing:.14em;font-weight:600}
.punkt-offen{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.status{font-size:12px;color:var(--muted);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.status.ok{color:var(--ok)} .status.warn{color:var(--accent)} .status.err{color:var(--err)}

/* -------------------------------------------------------------------- Rumpf */
.rumpf{flex:1;display:flex;min-height:0}
.seite{width:290px;flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.seite.links{border-right:1px solid var(--line)}
.seite.rechts{width:370px;border-left:1px solid var(--line)}
.abschnitt{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;
  flex-direction:column;gap:8px}
/* Nichts in der Spalte darf schrumpfen: sonst quetscht der Flex-Container die
   Segment-Leisten auf halbe Höhe, sobald der Inhalt länger wird als das Fenster. */
.abschnitt > *{flex:none}
.abschnitt.wachsend{flex:1;min-height:0;overflow-y:auto;border-bottom:none}
.ueberschrift{font-size:10.5px;letter-spacing:.12em;color:var(--dim);font-weight:600}

/* ------------------------------------------------------------------- Punkte */
.punkt{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;
  background:var(--bg);border:1px solid var(--sub);cursor:grab;
}
.punkt:hover{border-color:var(--dim)}
.punkt .kugel{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid #0006}
.punkt .nr{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none}
.punkt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punkt .xy{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none}

/* -------------------------------------------------------------------- Board */
.board{
  flex:1;min-width:0;overflow:auto;background:var(--bg);
  background-image:radial-gradient(#1C2333 1px,transparent 1px);background-size:24px 24px;
}
.phasen{display:flex;gap:18px;padding:18px 20px 40px;min-width:min-content;align-items:flex-start}
.phase{width:286px;flex:none;display:flex;flex-direction:column;gap:8px}
.phase-kopf{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.phase-kopf.init{border-left:3px solid #64748B}
.phase-kopf.loop{border-left:3px solid var(--accent)}
.phase-kopf.end{border-left:3px solid #38BDF8}
.phase-name{font-weight:600;font-size:13px;background:none;border:1px solid transparent;
  padding:1px 4px;border-radius:3px}
.phase-name:hover:not(:disabled){border-color:var(--line)}
.phase-name:disabled{color:var(--text)}
.zaehler{font-family:var(--mono);font-size:11px;color:var(--accent);flex:none}
.phase-werkzeug{display:flex;gap:6px;align-items:center}
.phase-werkzeug input{padding:3px 5px;font-size:11.5px}

/* ------------------------------------------------------------------- Karten */
.karte{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  cursor:grab;overflow:hidden;
}
.karte:hover{border-color:var(--dim)}
.karte.gewaehlt{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.karte-kopf{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--sub);
  border-bottom:1px solid var(--line)}
.karte-typ{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;font-weight:600;
  padding:2px 5px;border-radius:3px;color:#0C0F14;flex:none}
.karte-nr{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto;flex:none}
.karte-leib{padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.karte-titel{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.karte-zeile{font-family:var(--mono);font-size:11px;color:var(--muted)}
.karte-farbe{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.karte-farbe .feldchen{width:12px;height:12px;border-radius:3px;border:1px solid #0006;flex:none}
.karte-else{display:flex;align-items:center;gap:6px;padding-top:6px;
  border-top:1px dashed var(--line);color:var(--accent);font-size:11px}
.marke-klein{font-family:var(--mono);font-size:9.5px;padding:1px 4px;border-radius:3px;
  border:1px solid var(--line);color:var(--dim)}
.marke-klein.warn{color:var(--accent);border-color:var(--accent)}

/* Die Einfügestelle liegt zwischen zwei Karten und ist unsichtbar, bis etwas
   darüber schwebt. Die negativen Ränder heben die beiden Flex-Abstände wieder
   auf, die sie sonst zusätzlich zwischen die Karten schöbe. */
.ablage{height:2px;border-radius:1px;background:transparent;margin:-5px 0}
.ablage.aktiv{background:var(--accent)}
.leerzone{border:1px dashed var(--line);border-radius:6px;padding:9px;text-align:center;
  color:var(--dim);font-size:12px;cursor:pointer}
.leerzone:hover{border-color:var(--accent);color:var(--accent)}
.leerzone.aktiv{border-color:var(--accent);border-style:solid;color:var(--accent)}

/* ---------------------------------------------------------------- Inspektor */
.insp-kopf{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px}
.insp-punkt{width:9px;height:9px;border-radius:2px;flex:none}
.typ-chip{
  font-family:var(--mono);font-size:9.5px;text-align:center;padding:7px 3px;border-radius:4px;
  background:var(--sub);border:1px solid var(--line);color:var(--muted);cursor:pointer;
}
.typ-chip:hover{border-color:var(--dim);color:var(--text)}
.segment{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.segment button{flex:1;padding:5px 4px;font-size:11.5px;color:var(--muted);background:var(--bg)}
.segment button:hover{color:var(--text)}
.segment button.an{background:var(--accent);color:#0C0F14;font-weight:600}
.hinweis{font-size:11px;color:var(--dim);line-height:1.5}
.leer{padding:24px 14px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7}

/* ------------------------------------------------------------------- Dialog */
.schleier{position:fixed;inset:0;background:#0C0F14CC;display:flex;align-items:center;
  justify-content:center;z-index:20}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:20px;width:420px;display:flex;flex-direction:column;gap:14px}
.dialog h2{font-size:14px}
.dialog p{font-size:12.5px;color:var(--muted);line-height:1.6}
.dialog .knoepfe{display:flex;gap:8px;justify-content:flex-end}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="app">
  <header class="kopf">
    <div class="reihe">
      <div class="marke">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3l14 9-14 9z"/>
        </svg>
      </div>
      <span class="titel">SEQUENZ-STUDIO</span>
    </div>
    <div class="trenner"></div>
    <div class="reihe">
      <select id="seq-auswahl" style="width:200px"></select>
      <button class="btn" id="btn-laden">Laden</button>
      <button class="btn" id="btn-neu">Neu</button>
    </div>
    <div class="trenner"></div>
    <div class="reihe">
      <button class="btn haupt" id="btn-speichern">Speichern</button>
      <span class="punkt-offen" id="punkt-offen" hidden title="ungespeicherte Änderungen"></span>
      <span class="klein mono" id="datei"></span>
    </div>
    <div class="wachse"></div>
    <span class="status" id="status"></span>
  </header>

  <div class="rumpf">
    <aside class="seite links">
      <div class="abschnitt">
        <span class="ueberschrift">SEQUENZ</span>
        <label class="feld">Name
          <input id="seq-name" autocomplete="off">
        </label>
        <div class="gitter2">
          <label class="feld">Zyklen (0 = endlos)
            <input id="seq-zyklen" type="number" min="0" step="1">
          </label>
          <label class="feld">Blöcke
            <input id="seq-bloecke" disabled>
          </label>
        </div>
        <label class="feld">Notiz
          <textarea id="seq-info"></textarea>
        </label>
      </div>
      <div class="abschnitt wachsend">
        <div class="reihe">
          <span class="ueberschrift wachse">PUNKTE</span>
          <span class="klein mono" id="punkte-zahl"></span>
        </div>
        <input id="punkt-filter" placeholder="filtern…" autocomplete="off">
        <div class="spalte" id="punkte" style="gap:4px"></div>
        <p class="hinweis">Punkt in eine Phase ziehen — das wird ein Klick-Block,
          der dem Punkt folgt. Aufgenommen wird im Hauptprozess.</p>
      </div>
    </aside>

    <main class="board" id="board">
      <div class="phasen" id="phasen"></div>
    </main>

    <aside class="seite rechts">
      <div class="insp-kopf">
        <span class="insp-punkt" id="insp-punkt"></span>
        <span class="ueberschrift wachse" id="insp-titel">KEIN BLOCK</span>
        <button class="btn still" id="btn-block-weg" title="Auswahl löschen (Entf)">löschen</button>
      </div>
      <div class="abschnitt wachsend" id="inspektor"></div>
    </aside>
  </div>
</div>

<div class="schleier" id="schleier" hidden>
  <div class="dialog">
    <h2 id="dialog-titel">Ungespeicherte Änderungen</h2>
    <p id="dialog-text"></p>
    <div class="knoepfe">
      <button class="btn" id="dialog-ab">Abbrechen</button>
      <button class="btn gefahr" id="dialog-weg">Verwerfen</button>
      <button class="btn haupt" id="dialog-speichern">Speichern &amp; weiter</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ Werkzeug */

const $ = (id) => document.getElementById(id);

/** Kleiner DOM-Bauer: el("div", {class:"x", onclick:f}, kind, "text") */
function el(tag, attrs, ...kinder) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style") n.setAttribute("style", v);
    else if (k === "text") n.textContent = v;
    else if (v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  for (const kind of kinder.flat()) {
    if (kind === null || kind === undefined || kind === false) continue;
    n.appendChild(typeof kind === "object" ? kind : document.createTextNode(String(kind)));
  }
  return n;
}

/** Zahlenfeld, das seinen Wert erst beim Verlassen meldet.
 *
 * Bewusst `change` und nicht `input`: jede Meldung baut die Ansicht neu, und ein
 * Neuaufbau mitten in der Eingabe nimmt das Feld weg, in das gerade getippt wird.
 * Dieselbe Regel wie beim Dear-PyGui-Vorgänger — diskrete Bedienelemente (Klick,
 * fertig) dürfen sofort melden, Tipp-Felder erst am Ende. */
function feld(beschriftung, wert, beim_setzen, extra) {
  const eingabe = el("input", Object.assign({value: wert === null || wert === undefined ? "" : wert,
                                             autocomplete: "off"}, extra || {}));
  eingabe.addEventListener("change", () => beim_setzen(eingabe.value));
  eingabe.addEventListener("keydown", (e) => { if (e.key === "Enter") eingabe.blur(); });
  return el("label", {class: "feld"}, beschriftung, eingabe);
}

function zahlfeld(beschriftung, wert, beim_setzen, extra) {
  return feld(beschriftung, wert, (v) => beim_setzen(Number(v) || 0),
              Object.assign({type: "number"}, extra || {}));
}

function schalter(beschriftung, an, beim_setzen) {
  const box = el("input", {type: "checkbox"});
  box.checked = !!an;
  box.addEventListener("change", () => beim_setzen(box.checked));
  return el("label", {class: "an"}, box, beschriftung);
}

function auswahl(beschriftung, werte, aktuell, beim_setzen) {
  const s = el("select");
  for (const w of werte) {
    const o = el("option", {value: String(w.wert)}, w.text);
    if (String(w.wert) === String(aktuell)) o.selected = true;
    s.appendChild(o);
  }
  s.addEventListener("change", () => beim_setzen(s.value));
  return beschriftung ? el("label", {class: "feld"}, beschriftung, s) : s;
}

function segment(werte, aktuell, beim_setzen) {
  return el("div", {class: "segment"}, werte.map((w) =>
    el("button", {class: w.wert === aktuell ? "an" : "", onclick: () => beim_setzen(w.wert)},
       w.text)));
}

function ueberschrift(text) { return el("span", {class: "ueberschrift"}, text); }

/* -------------------------------------------------------------------- Brücke */

let S = null;             // letzte Momentaufnahme
let ziehen = null;        // was gerade gezogen wird
let aktiveAblage = null;  // hervorgehobene Einfügestelle
let offeneFrage = null;

function warteAufBruecke() {
  return new Promise((fertig) => {
    if (window.pywebview && window.pywebview.api) return fertig();
    window.addEventListener("pywebviewready", () => fertig(), {once: true});
  });
}

/** Ein Befehl an die Brücke. Antwort ist immer die neue Momentaufnahme. */
async function ruf(name, daten) {
  try {
    const antwort = await window.pywebview.api[name](daten === undefined ? null : daten);
    uebernimm(antwort);
  } catch (e) {
    setzeStatus({text: String(e && e.message ? e.message : e), art: "err"});
  }
}

function uebernimm(neu) {
  if (!neu) return;
  S = neu;
  zeichne();
  if (S.frage) zeigeFrage(S.frage);
}

/* ------------------------------------------------------------------ Zeichnen */

function zeichne() {
  if (!S) return;
  $("datei").textContent = S.datei || "";
  $("punkt-offen").hidden = !S.dirty;
  document.title = (S.dirty ? "* " : "") + "Sequenz-Studio – " + S.name;
  setzeStatus(S.status);
  zeichneKopf();
  zeichneSequenz();
  zeichnePunkte();
  zeichnePhasen();
  zeichneInspektor();
}

function setzeStatus(status) {
  const n = $("status");
  n.textContent = (status && status.text) || "";
  n.className = "status " + ((status && status.art) || "");
}

function zeichneKopf() {
  const s = $("seq-auswahl");
  s.replaceChildren();
  if (!S.sequenzen.length) s.appendChild(el("option", {value: ""}, "(keine gespeichert)"));
  // Eine frisch angelegte Sequenz steht noch in keiner Datei — ohne diesen Eintrag
  // zeigte die Liste einen fremden Namen an, während man an ihr arbeitet.
  if (S.name && !S.sequenzen.includes(S.name)) {
    const o = el("option", {value: S.name}, S.name + " (ungespeichert)");
    o.selected = true;
    s.appendChild(o);
  }
  for (const name of S.sequenzen) {
    const o = el("option", {value: name}, name);
    if (name === S.name) o.selected = true;
    s.appendChild(o);
  }
}

function zeichneSequenz() {
  if (document.activeElement !== $("seq-name")) $("seq-name").value = S.name;
  if (document.activeElement !== $("seq-zyklen")) $("seq-zyklen").value = S.zyklen;
  if (document.activeElement !== $("seq-info")) $("seq-info").value = S.beschreibung;
  $("seq-bloecke").value = S.phasen.reduce((n, p) => n + p.bloecke.length, 0);
}

function zeichnePunkte() {
  const filter = $("punkt-filter").value.trim().toLowerCase();
  const liste = S.punkte.filter((p) => !filter ||
      (p.name + " #" + p.id + " " + p.x + "," + p.y).toLowerCase().includes(filter));
  $("punkte-zahl").textContent = liste.length + "/" + S.punkte.length;
  const ziel = $("punkte");
  ziel.replaceChildren();
  if (!S.punkte.length) {
    ziel.appendChild(el("p", {class: "hinweis"},
      "Noch keine Punkte aufgenommen. Im Hauptprozess mit CTRL+ALT+A anlegen."));
    return;
  }
  for (const p of liste) {
    ziel.appendChild(el("div", {
      class: "punkt", draggable: "true", title: p.quelle || "",
      ondragstart: (e) => { ziehen = {art: "punkt", punkt: p.id};
                            e.dataTransfer.effectAllowed = "copy"; },
      ondragend: () => { ziehen = null; loescheAblage(); },
    },
      el("span", {class: "kugel", style: "background:" + (p.farbe || "#2A3245")}),
      el("span", {class: "nr"}, "#" + p.id),
      el("span", {class: "name"}, p.name),
      el("span", {class: "xy"}, p.x + "," + p.y)));
  }
}

/* --------------------------------------------------------------------- Board */

function zeichnePhasen() {
  const ziel = $("phasen");
  ziel.replaceChildren();
  for (const phase of S.phasen) ziel.appendChild(zeichnePhase(phase));
  ziel.appendChild(el("div", {class: "phase"},
    el("button", {class: "leerzone", onclick: () => ruf("phase_anhaengen")},
       "+ Loop-Phase")));
}

function zeichnePhase(phase) {
  const kopf = el("div", {class: "phase-kopf " + phase.art});
  // INIT und END tragen keinen frei wählbaren Namen — sie bekommen deshalb auch
  // kein Eingabefeld, das nichts annimmt.
  const name = phase.art === "loop"
    ? el("input", {class: "phase-name wachse", value: phase.name})
    : el("span", {class: "phase-name wachse"}, phase.name);
  name.addEventListener("change", () => ruf("phase_setzen",
    {phase: phase.index, feld: "name", wert: name.value}));
  kopf.appendChild(el("div", {class: "reihe"}, name,
    phase.art === "loop" ? el("span", {class: "zaehler"}, "×" + phase.wiederholungen) : null,
    el("span", {class: "klein mono"}, phase.bloecke.length + " Schritte")));

  if (phase.art === "loop") {
    const wdh = el("input", {type: "number", min: "1", value: phase.wiederholungen,
                             style: "width:70px", title: "Wiederholungen"});
    wdh.addEventListener("change", () => ruf("phase_setzen",
      {phase: phase.index, feld: "wiederholungen", wert: Number(wdh.value) || 1}));
    const start = el("input", {value: phase.start, placeholder: "HH:MM",
                               style: "width:74px", title: "Start erst ab dieser Uhrzeit"});
    start.addEventListener("change", () => ruf("phase_setzen",
      {phase: phase.index, feld: "start", wert: start.value}));
    kopf.appendChild(el("div", {class: "phase-werkzeug"}, wdh, start,
      el("button", {class: "btn still gefahr", title: "Phase löschen",
                    onclick: () => ruf("phase_loeschen", {phase: phase.index})}, "×")));
  }

  const spalte = el("div", {class: "phase"}, kopf);
  phase.bloecke.forEach((block, i) => {
    spalte.appendChild(ablage(phase.index, i));
    spalte.appendChild(zeichneKarte(phase, block));
  });
  spalte.appendChild(ablage(phase.index, phase.bloecke.length));
  spalte.appendChild(el("button", {
    class: "leerzone",
    onclick: () => ruf("block_anhaengen", {phase: phase.index}),
    ondragover: (e) => { if (ziehen) { e.preventDefault(); markiere(e.currentTarget); } },
    ondragleave: () => loescheAblage(),
    ondrop: (e) => abwerfen(e, phase.index, phase.bloecke.length),
  }, phase.bloecke.length ? "+ Block" : "leer — Block anlegen oder Punkt herziehen"));
  return spalte;
}

/** Einfügestelle zwischen zwei Karten: nur ein Strich, der aufleuchtet. */
function ablage(phase, zeile) {
  return el("div", {
    class: "ablage",
    ondragover: (e) => { if (ziehen) { e.preventDefault(); markiere(e.currentTarget); } },
    ondragleave: () => loescheAblage(),
    ondrop: (e) => abwerfen(e, phase, zeile),
  });
}

function markiere(n) {
  if (aktiveAblage === n) return;
  loescheAblage();
  aktiveAblage = n;
  n.classList.add("aktiv");
}

function loescheAblage() {
  if (aktiveAblage) aktiveAblage.classList.remove("aktiv");
  aktiveAblage = null;
}

function abwerfen(e, phase, zeile) {
  e.preventDefault();
  e.stopPropagation();
  loescheAblage();
  const was = ziehen;
  ziehen = null;
  if (!was) return;
  if (was.art === "punkt") ruf("punkt_einfuegen", {phase: phase, zeile: zeile, punkt: was.punkt});
  else ruf("ziehen", {von_phase: was.phase, von_zeile: was.zeile,
                      nach_phase: phase, nach_zeile: zeile});
}

function zeichneKarte(phase, block) {
  const leib = el("div", {class: "karte-leib"},
    block.titel ? el("div", {class: "karte-titel"}, block.titel) : null,
    block.zeilen.map((z) => el("div", {class: "karte-zeile"}, z)));

  if (block.farbfeld) {
    leib.appendChild(el("div", {class: "karte-farbe"},
      el("span", {class: "feldchen", style: "background:" + block.farbfeld}),
      block.farbtext));
  }
  if (block.else_text) {
    leib.appendChild(el("div", {class: "karte-else"}, block.else_text));
  }

  return el("div", {
    class: "karte" + (block.gewaehlt ? " gewaehlt" : ""),
    draggable: "true",
    onclick: (e) => ruf("waehlen", {
      phase: phase.index, zeile: block.zeile,
      modus: e.ctrlKey || e.metaKey ? "dazu" : (e.shiftKey ? "bereich" : "einzeln")}),
    ondragstart: (e) => { ziehen = {art: "block", phase: phase.index, zeile: block.zeile};
                          e.dataTransfer.effectAllowed = "move"; },
    ondragend: () => { ziehen = null; loescheAblage(); },
    ondragover: (e) => {
      if (!ziehen) return;
      e.preventDefault();
      const r = e.currentTarget.getBoundingClientRect();
      const unten = e.clientY > r.top + r.height / 2;
      const strich = unten ? e.currentTarget.nextElementSibling
                           : e.currentTarget.previousElementSibling;
      if (strich && strich.classList.contains("ablage")) markiere(strich);
    },
    ondrop: (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      abwerfen(e, phase.index, block.zeile + (e.clientY > r.top + r.height / 2 ? 1 : 0));
    },
  },
    el("div", {class: "karte-kopf"},
      el("span", {class: "karte-typ", style: "background:" + block.farbe}, block.label),
      block.prueft ? el("span", {class: "marke-klein", title: "prüft nach der Aktion nach"},
                        "prüft") : null,
      block.warnung ? el("span", {class: "marke-klein warn"}, block.warnung) : null,
      el("span", {class: "karte-nr"}, String(block.zeile + 1).padStart(2, "0"))),
    leib);
}

/* ----------------------------------------------------------------- Inspektor */

function punktListe(aktuell, mitLeer) {
  const werte = S.punkte.map((p) => ({wert: p.id, text: "#" + p.id + " " + p.name +
                                                        " (" + p.x + "," + p.y + ")"}));
  if (mitLeer || aktuell === null || aktuell === undefined) {
    werte.unshift({wert: "", text: "(kein Punkt)"});
  }
  return werte;
}

function zeichneInspektor() {
  const ziel = $("inspektor");
  ziel.replaceChildren();
  const b = S.block;
  const gewaehlt = S.auswahl.zeilen.length;

  $("btn-block-weg").disabled = gewaehlt === 0;
  if (!b) {
    $("insp-punkt").style.background = "#2A3245";
    $("insp-titel").textContent = gewaehlt > 1 ? gewaehlt + " BLÖCKE GEWÄHLT" : "KEIN BLOCK";
    ziel.appendChild(el("div", {class: "leer"}, gewaehlt > 1
      ? el("span", {}, "Mehrfachauswahl: verschieben mit ALT+↑/↓, löschen mit Entf.",
           el("br"), "Für die Einstellungen einen einzelnen Block wählen.")
      : el("span", {}, "Block anklicken, um ihn zu bearbeiten.", el("br"),
           "Ziehen sortiert um — auch über Phasengrenzen.")));
    return;
  }

  const phase = S.phasen[b.phase];
  $("insp-punkt").style.background = b.farbe;
  $("insp-titel").textContent = "BLOCK " + String(b.zeile + 1).padStart(2, "0") +
                                " · " + phase.name.toUpperCase();

  // --- Typ ---
  ziel.appendChild(ueberschrift("BLOCK-TYP"));
  ziel.appendChild(el("div", {class: "gitter3"}, S.typen.map((t) =>
    el("button", {
      class: "typ-chip",
      style: t.key === b.typ ? "background:" + t.farbe + ";border-color:" + t.farbe +
                               ";color:#0C0F14;font-weight:600" : "",
      onclick: () => ruf("block_typ", {typ: t.key}),
    }, t.label))));

  // --- Gemeinsames ---
  if (b.typ !== "screenshot") {
    if (b.point_id === null || b.point_id === undefined) {
      ziel.appendChild(feld("Name", b.name, (v) => ruf("block_setzen", {feld: "name", wert: v})));
    } else {
      // Ein Schritt mit Punkt hat keinen eigenen Namen: er wird beim Laden aus
      // points.json geholt. Statt eines toten Feldes bearbeitet dieses hier den
      // Punkt — sichtbar beschriftet, weil es alle Blöcke darauf mitzieht.
      ziel.appendChild(feld("Name (Punkt #" + b.point_id + ")", b.name,
        (v) => ruf("punkt_setzen", {punkt: b.point_id, feld: "name", wert: v})));
      ziel.appendChild(el("p", {class: "hinweis"},
        "Der Name gehört dem Punkt — alle Blöcke, die ihn benutzen, heißen mit."));
    }
    ziel.appendChild(el("div", {class: "gitter2"},
      zahlfeld("Wartezeit (s)", b.delay_before,
               (v) => ruf("block_setzen", {feld: "delay_before", wert: v}),
               {step: "0.1", min: "0"}),
      zahlfeld("bis (0 = fest)", b.delay_max,
               (v) => ruf("block_setzen", {feld: "delay_max", wert: v}),
               {step: "0.1", min: "0"})));
  }

  if (b.typ === "click" || b.typ === "wait_click" || b.typ === "wait") baueStelle(ziel, b);
  if (b.typ === "key") {
    ziel.appendChild(feld("Taste", b.key_press,
      (v) => ruf("block_setzen", {feld: "key_press", wert: v}), {placeholder: "enter, space, f1"}));
  }
  baueScan(ziel, b);
  if (b.typ === "screenshot") baueScreenshot(ziel, b);

  if (b.typ !== "screenshot") baueTrigger(ziel, b);
  baueElse(ziel, b);
}

function baueStelle(ziel, b) {
  ziel.appendChild(ueberschrift("STELLE"));
  if (!S.punkte.length && b.point_id === null) {
    ziel.appendChild(el("p", {class: "hinweis"},
      "Keine Punkte vorhanden. Im Hauptprozess mit CTRL+ALT+A aufnehmen — " +
      "oder hier eine Stelle eintragen, dann entsteht ein Punkt dafür."));
  } else {
    ziel.appendChild(auswahl("Punkt", punktListe(b.point_id), b.point_id === null ? "" : b.point_id,
      (v) => v && ruf("block_punkt", {punkt: Number(v)})));
  }
  ziel.appendChild(el("div", {class: "gitter2"},
    zahlfeld("X", b.x, (v) => setzeStelle(b, v, b.y), {step: "1"}),
    zahlfeld("Y", b.y, (v) => setzeStelle(b, b.x, v), {step: "1"})));
  ziel.appendChild(el("p", {class: "hinweis"},
    "X und Y verschieben den Punkt — alle Blöcke darauf ziehen mit. " +
    "Die Sequenz selbst hält keine Koordinaten."));
  if (b.typ !== "wait") {
    ziel.appendChild(schalter("nur warten (kein Klick)", b.wait_only,
      (an) => ruf("block_setzen", {feld: "wait_only", wert: an})));
  }
  if (b.scroll) {
    ziel.appendChild(zahlfeld("Mausrad (Stufen, 0 = kein Rad)", b.scroll,
      (v) => ruf("block_setzen", {feld: "scroll", wert: v}), {step: "1"}));
  }
}

function setzeStelle(b, x, y) {
  if (b.point_id === null || b.point_id === undefined) {
    ruf("punkt_anlegen", {x: x, y: y});
  } else {
    // Zwei Felder, ein Punkt: nur die geänderte Achse schicken.
    if (x !== b.x) ruf("punkt_setzen", {punkt: b.point_id, feld: "x", wert: x});
    if (y !== b.y) ruf("punkt_setzen", {punkt: b.point_id, feld: "y", wert: y});
  }
}

function baueScan(ziel, b) {
  const scans = {item_scan: ["ITEM-SCAN", "item_scan"], icon_scan: ["ICON-SCAN", "icon_scan"],
                 boss_scan: ["BOSS-SCAN", "boss_scan"], boss_watcher: ["BOSS-WATCHER", "boss_watcher"]};
  const eintrag = scans[b.typ];
  if (!eintrag) return;
  const [titel, feldname] = eintrag;
  ziel.appendChild(ueberschrift(titel));
  ziel.appendChild(feld("Name der Konfiguration", b[feldname],
    (v) => ruf("block_setzen", {feld: feldname, wert: v})));
  ziel.appendChild(el("p", {class: "hinweis"},
    "Name eines im Item-/Boss-/Icon-Editor angelegten Scans. Ohne ihn wird nicht gespeichert."));
  if (b.typ === "item_scan") {
    ziel.appendChild(auswahl("Modus", S.scan_modi.map((m) => ({wert: m, text: m})),
      b.item_scan_mode, (v) => ruf("block_setzen", {feld: "item_scan_mode", wert: v})));
  }
}

function baueScreenshot(ziel, b) {
  ziel.appendChild(ueberschrift("SCREENSHOT"));
  const hatBereich = !!b.screenshot_region;
  ziel.appendChild(schalter("Bereich statt Vollbild", hatBereich,
    (an) => ruf("block_bereich", {werte: an ? (b.screenshot_region || [0, 0, 100, 100]) : null})));
  if (!hatBereich) return;
  const r = b.screenshot_region.slice();
  const setze = (i) => (v) => { r[i] = v; ruf("block_bereich", {werte: r}); };
  ziel.appendChild(el("div", {class: "gitter2"},
    zahlfeld("X1", r[0], setze(0)), zahlfeld("Y1", r[1], setze(1)),
    zahlfeld("X2", r[2], setze(2)), zahlfeld("Y2", r[3], setze(3))));
}

function baueTrigger(ziel, b) {
  const richtungen = [{wert: "kein", text: "kein"}, {wert: "da", text: "bis Farbe DA"},
                      {wert: "weg", text: "bis Farbe WEG"}];
  ziel.appendChild(ueberschrift("FARB-TRIGGER (VOR DEM SCHRITT)"));
  ziel.appendChild(segment(richtungen, b.trigger,
    (w) => ruf("block_trigger", {wahl: w})));
  if (b.trigger !== "kein") {
    ziel.appendChild(auswahl("Geprüfte Stelle", punktListe(b.trigger_punkt), b.trigger_punkt,
      (v) => v && ruf("block_trigger", {wahl: b.trigger, punkt: Number(v)})));
    ziel.appendChild(schalter("nur prüfen, nicht warten", b.trigger_pruefen,
      (an) => ruf("block_trigger", {wahl: b.trigger, pruefen: an})));
    ziel.appendChild(el("p", {class: "hinweis"},
      "Farbe und Stelle kommen aus dem Punkt. Soll an derselben Stelle auf eine " +
      "andere Farbe geprüft werden, ist das ein eigener Punkt."));
  } else if (b.point_id === null || b.point_id === undefined) {
    ziel.appendChild(el("p", {class: "hinweis"},
      "Ohne Punkt gibt es nichts zu prüfen — erst oben eine Stelle wählen."));
  }

  ziel.appendChild(ueberschrift("NACHPRÜFUNG (NACH DEM SCHRITT)"));
  ziel.appendChild(segment(richtungen, b.verify,
    (w) => ruf("block_trigger", {welche: "verify", wahl: w})));
  if (b.verify !== "kein") {
    ziel.appendChild(auswahl("Geprüfte Stelle", punktListe(b.verify_punkt), b.verify_punkt,
      (v) => v && ruf("block_trigger", {welche: "verify", wahl: b.verify, punkt: Number(v)})));
    ziel.appendChild(el("p", {class: "hinweis"},
      "„Hat die Aktion gewirkt?“ Bleibt die Wirkung aus, wird die Aktion " +
      "wiederholt (verify_retries), danach greift ELSE."));
  }
}

function baueElse(ziel, b) {
  ziel.appendChild(ueberschrift("ELSE — WENN DIE BEDINGUNG NICHT GREIFT"));
  const werte = [{wert: "", text: "(keine)"}].concat(
    S.else_aktionen.map((a) => ({wert: a, text: {
      skip: "Schritt überspringen", skip_cycle: "Zyklus abbrechen",
      restart: "Sequenz neu starten", click: "stattdessen klicken",
      key: "stattdessen Taste"}[a] || a})));
  ziel.appendChild(auswahl(null, werte, b.else_aktion,
    (v) => ruf("block_else", {aktion: v})));
  if (b.else_aktion === "click") {
    ziel.appendChild(auswahl("ELSE-Punkt", punktListe(b.else_punkt), b.else_punkt,
      (v) => v && ruf("block_else", {aktion: "click", punkt: Number(v)})));
  }
  if (b.else_aktion === "key") {
    ziel.appendChild(feld("ELSE-Taste", b.else_taste,
      (v) => ruf("block_else", {aktion: "key", taste: v})));
  }
  if (b.else_aktion) {
    ziel.appendChild(el("p", {class: "hinweis"},
      "ELSE ist ein „stattdessen“, kein „zusätzlich“: greift es, entfällt die " +
      "eigene Aktion des Schritts."));
  }
}

/* -------------------------------------------------------------------- Dialog */

function zeigeFrage(frage) {
  offeneFrage = frage;
  $("dialog-text").textContent = frage.text +
    " Vor dem " + (frage.art === "laden" ? "Laden" : "Anlegen") + " speichern?";
  $("schleier").hidden = false;
}

function schliesseFrage() {
  offeneFrage = null;
  $("schleier").hidden = true;
}

async function fortfahren(verwerfen) {
  const frage = offeneFrage;
  schliesseFrage();
  if (!frage) return;
  if (!verwerfen) await ruf("speichern");
  if (frage.art === "laden") await ruf("laden", {name: frage.ziel, verwerfen: true});
  else await ruf("neu", {verwerfen: true});
}

/* --------------------------------------------------------------- Verdrahtung */

function verdrahte() {
  $("btn-laden").addEventListener("click",
    () => ruf("laden", {name: $("seq-auswahl").value}));
  $("seq-auswahl").addEventListener("dblclick",
    () => ruf("laden", {name: $("seq-auswahl").value}));
  $("btn-neu").addEventListener("click", () => ruf("neu"));
  $("btn-speichern").addEventListener("click", speichere);
  $("btn-block-weg").addEventListener("click", () => ruf("auswahl_loeschen"));

  $("seq-name").addEventListener("change", (e) =>
    ruf("sequenz_setzen", {feld: "name", wert: e.target.value}));
  $("seq-zyklen").addEventListener("change", (e) =>
    ruf("sequenz_setzen", {feld: "zyklen", wert: Number(e.target.value) || 0}));
  $("seq-info").addEventListener("change", (e) =>
    ruf("sequenz_setzen", {feld: "beschreibung", wert: e.target.value}));
  $("punkt-filter").addEventListener("input", zeichnePunkte);

  $("dialog-ab").addEventListener("click", schliesseFrage);
  $("dialog-weg").addEventListener("click", () => fortfahren(true));
  $("dialog-speichern").addEventListener("click", () => fortfahren(false));

  // Ziehen über dem Board darf nicht als "Datei öffnen" enden.
  document.addEventListener("dragover", (e) => { if (ziehen) e.preventDefault(); });
  document.addEventListener("drop", (e) => e.preventDefault());
  document.addEventListener("keydown", tastatur);
}

async function speichere() {
  // Ein Feld, in dem gerade getippt wird, meldet seinen Wert erst beim Verlassen.
  // Ohne das Blur ginge die letzte Eingabe beim Speichern verloren.
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  await ruf("speichern");
}

function imTextfeld() {
  const a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT");
}

function tastatur(e) {
  if (e.key === "Escape") {
    if (offeneFrage) return schliesseFrage();
    if (imTextfeld()) return document.activeElement.blur();
    return ruf("auswahl_leeren");
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    return speichere();
  }
  if (imTextfeld() || offeneFrage) return;
  if (e.key === "Delete") { e.preventDefault(); return ruf("auswahl_loeschen"); }
  if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); return ruf("auswahl_verschieben", {delta: -1}); }
  if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); return ruf("auswahl_verschieben", {delta: 1}); }
}

warteAufBruecke().then(() => {
  verdrahte();
  ruf("snapshot");
});
</script>
